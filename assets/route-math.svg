<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Attainable mouse route optimization</title><desc id="desc">Comparison of center-to-center travel and optimized legal click points.</desc>
  <rect width="1200" height="390" rx="18" fill="#f4f7f8"/>
  <g font-family="Arial, sans-serif"><text x="50" y="52" font-size="27" font-weight="700" fill="#142b38">THE CENTER IS NOT THE ONLY LEGAL CLICK</text><text x="50" y="82" font-size="16" fill="#536875">Choose a point inside every marker, then minimize the complete repeating route.</text>
    <g transform="translate(55 120)"><text font-size="17" font-weight="700" fill="#536875">CENTER-TO-CENTER</text><g fill="#d9e8ed" stroke="#2f6f8f" stroke-width="3"><rect x="10" y="40" width="150" height="100" rx="8"/><rect x="215" y="110" width="145" height="95" rx="8"/><rect x="420" y="35" width="150" height="110" rx="8"/></g><polyline points="85,90 287,157 495,90 85,90" fill="none" stroke="#e2923f" stroke-width="4" stroke-dasharray="9 7"/><g fill="#e2923f"><circle cx="85" cy="90" r="7"/><circle cx="287" cy="157" r="7"/><circle cx="495" cy="90" r="7"/></g><text x="145" y="250" font-size="16" fill="#536875">Simple, but longer than necessary</text></g>
    <line x1="620" y1="112" x2="620" y2="345" stroke="#cad7dc" stroke-width="2"/>
    <g transform="translate(665 120)"><text font-size="17" font-weight="700" fill="#126f63">ATTAINABLE ROUTE</text><g fill="#d9eee9" stroke="#1f9f8e" stroke-width="3"><rect x="10" y="40" width="150" height="100" rx="8"/><rect x="215" y="110" width="145" height="95" rx="8"/><rect x="420" y="35" width="150" height="110" rx="8"/></g><polyline points="148,132 225,128 426,132 148,132" fill="none" stroke="#1f9f8e" stroke-width="5"/><g fill="#ffc244" stroke="#142b38" stroke-width="2"><circle cx="148" cy="132" r="7"/><circle cx="225" cy="128" r="7"/><circle cx="426" cy="132" r="7"/></g><text x="122" y="250" font-size="16" fill="#536875">Every point stays inside a legal marker</text></g>
  </g>
</svg>
