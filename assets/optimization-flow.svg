<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Rooftop Camera Planner optimization flow</title><desc id="desc">Five stages from a clean lap to verified screen markers.</desc>
  <rect width="1200" height="360" fill="#101f29" rx="18"/>
  <g font-family="Arial, sans-serif"><text x="54" y="55" fill="#fff" font-size="28" font-weight="700">FROM A REAL LAP TO A VERIFIED ROUTE</text><text x="54" y="84" fill="#97aab6" font-size="16">Measured locally. Compared geometrically. Drawn only when trusted.</text>
    <g transform="translate(50 125)">
      <g><rect width="190" height="155" rx="10" fill="#172d39" stroke="#456071"/><circle cx="28" cy="30" r="14" fill="#44e0c4"/><text x="23" y="36" font-size="16" font-weight="700" fill="#10212b">1</text><text x="22" y="72" fill="#fff" font-size="18" font-weight="700">CLEAN LAP</text><text x="22" y="101" fill="#a9bac4" font-size="14">Ordered obstacles</text><text x="22" y="124" fill="#a9bac4" font-size="14">Settled camera</text></g>
      <g stroke="#44e0c4" stroke-width="3" fill="none"><path d="M205 77h36"/><path d="m235 69 10 8-10 8"/></g>
      <g transform="translate(255)"><rect width="190" height="155" rx="10" fill="#172d39" stroke="#456071"/><circle cx="28" cy="30" r="14" fill="#44e0c4"/><text x="23" y="36" font-size="16" font-weight="700" fill="#10212b">2</text><text x="22" y="72" fill="#fff" font-size="18" font-weight="700">CLICK REGIONS</text><text x="22" y="101" fill="#a9bac4" font-size="14">Safe inner boxes</text><text x="22" y="124" fill="#a9bac4" font-size="14">Canvas-aware</text></g>
      <g transform="translate(255)" stroke="#44e0c4" stroke-width="3" fill="none"><path d="M205 77h36"/><path d="m235 69 10 8-10 8"/></g>
      <g transform="translate(510)"><rect width="190" height="155" rx="10" fill="#172d39" stroke="#456071"/><circle cx="28" cy="30" r="14" fill="#ffc244"/><text x="23" y="36" font-size="16" font-weight="700" fill="#10212b">3</text><text x="22" y="72" fill="#fff" font-size="18" font-weight="700">SOLVE ROUTE</text><text x="22" y="101" fill="#a9bac4" font-size="14">Overlap first</text><text x="22" y="124" fill="#a9bac4" font-size="14">Minimize travel</text></g>
      <g transform="translate(510)" stroke="#44e0c4" stroke-width="3" fill="none"><path d="M205 77h36"/><path d="m235 69 10 8-10 8"/></g>
      <g transform="translate(765)"><rect width="190" height="155" rx="10" fill="#172d39" stroke="#456071"/><circle cx="28" cy="30" r="14" fill="#44e0c4"/><text x="23" y="36" font-size="16" font-weight="700" fill="#10212b">4</text><text x="22" y="72" fill="#fff" font-size="18" font-weight="700">VERIFY VIEW</text><text x="22" y="101" fill="#a9bac4" font-size="14">Reachable camera</text><text x="22" y="124" fill="#a9bac4" font-size="14">Fresh full lap</text></g>
      <g transform="translate(765)" stroke="#44e0c4" stroke-width="3" fill="none"><path d="M205 77h36"/><path d="m235 69 10 8-10 8"/></g>
      <g transform="translate(1020)"><rect width="130" height="155" rx="10" fill="#1a443f" stroke="#44e0c4"/><circle cx="28" cy="30" r="14" fill="#44e0c4"/><text x="23" y="36" font-size="16" font-weight="700" fill="#10212b">5</text><text x="22" y="72" fill="#fff" font-size="18" font-weight="700">DRAW</text><text x="22" y="101" fill="#c4eee7" font-size="14">M-markers</text><text x="22" y="124" fill="#c4eee7" font-size="14">in order</text></g>
